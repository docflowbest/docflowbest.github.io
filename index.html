<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Квест 23 февраля</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <header class="header">
    <h1>Квест на 23 февраля</h1>

    <div class="meta">
      <div class="badge" id="badge">Вопрос <span id="qnum">1</span>/<span id="qtotal">12</span></div>
      <div class="progress" aria-label="progress">
        <div class="bar" id="bar"></div>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="card quiz" id="quizCard">
      <div class="question" id="question">...</div>
      <div class="answers" id="answers"></div>

      <div class="controls">
        <button class="btn ghost" id="btnBack">← Вернуться</button>
        <button class="btn primary" id="btnNext" disabled>Вперёд →</button>
       <!-- <button class="btn ghost" id="btnRestart">Сбросить</button>
        -->
      </div>
    </section>

    <aside class="card media" id="mediaCard">
     <!-- <div class="mediaTitle">Видео/мемо</div>
 -->
      <!-- В ЭТОМ ЖЕ DIV и видео, и картинка -->
      <div class="videoWrap" id="videoWrap" style="display:none;">
        <video id="qVideo" controls playsinline preload="metadata" style="display:none;"></video>
        <img id="qImage" alt="" style="display:none;" />
      </div>

      <div class="videoCaption" id="videoCaption" style="display:none;"></div>

      <div class="noVideo" id="noVideo" style="display:none;">
        Тут появится медиа для этого вопроса 🙂
      </div>
    </aside>
  </main>

  <!-- Чистая страница результата -->
  <section id="resultScreen" style="display:none;">
    <div class="resultPage">
      <div class="resultBox">
        <div class="resultTitle" id="resultTitle"></div>
        <div class="resultText" id="resultText"></div>

        <div class="controls" style="margin-top:30px; justify-content:center;">
          <button class="btn primary" id="btnAgain">Пройти ещё раз</button>
         <!-- <button class="btn ghost" id="btnCopy">Скопировать</button>
          -->
        </div>
      </div>
    </div>
  </section>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
